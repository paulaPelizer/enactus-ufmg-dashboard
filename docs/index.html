<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#111111" />
  <title>Enactus UFMG · Radar de Oportunidades</title>
  <link rel="stylesheet" href="assets/base.css" />
  <link rel="stylesheet" href="assets/dashboard.css" />
  <link rel="stylesheet" href="assets/responsive.css" />
</head>
<body>
  <div id="app-view" class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo-placeholder compact">LOGO<br><strong>ENACTUS</strong></div>
        <div>
          <div class="sidebar-title">Enactus UFMG</div>
          <div class="sidebar-subtitle">Radar & Estratégia</div>
        </div>
      </div>
      <nav id="nav-tabs" class="nav-tabs"></nav>
      <div class="sidebar-footer">
        <div class="user-card">
          <span class="avatar">M</span>
          <div><strong>MVP público</strong><small>Sem autenticação</small></div>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <p class="eyebrow">Enactus UFMG · dados estratégicos</p>
          <h2 id="page-title">Visão geral</h2>
        </div>
        <div class="topbar-actions">
          <span id="data-updated" class="meta-pill">Base: —</span>
          <button id="refresh-radar" class="outline-button">Atualizar Radar</button>
        </div>
      </header>
      <div id="content" class="content"></div>
      <footer class="site-footer">
        <span>Dashboard MVP · acesso público temporário</span>
        <span id="app-version">v1.0.0</span>
      </footer>
    </main>
  </div>

  <template id="table-template">
    <section class="panel data-panel">
      <div class="panel-header">
        <div>
          <h3 class="panel-title"></h3>
          <p class="panel-description"></p>
        </div>
        <div class="panel-actions">
          <button class="outline-button filters-toggle">Filtros avançados</button>
          <button class="outline-button export-csv">Exportar CSV</button>
        </div>
      </div>
      <div class="table-toolbar">
        <div class="search-box"><span>⌕</span><input class="global-search" type="search" placeholder="Pesquisar em todas as colunas…" /></div>
        <button class="clear-button clear-filters">Limpar filtros</button>
        <span class="row-count"></span>
      </div>
      <div class="column-filters hidden"></div>
      <div class="table-scroll"><table><thead></thead><tbody></tbody></table></div>
    </section>
  </template>

  <script src="assets/core.js" defer></script>
  <script src="assets/table.js" defer></script>
  <script src="assets/render.js" defer></script>
  <script src="assets/app-main.js" defer></script>
</body>
</html>
